# configs/kaggle/model_kaggle.yaml
# Tối ưu cho Kaggle 2x T4 16GB (Internet ON).
# Binary classification: CodeBERT (125M) + Full Fine-Tuning + PDG (RGCN).
#   - Full fine-tuning cho CodeBERT (~125M params) nhẹ nhàng trên 16GB VRAM.
#   - CLS pooling cho RoBERTa/encoder-only architecture.
#   - FP16 AMP để tăng tốc độ huấn luyện và tiết kiệm bộ nhớ.
#   - Residual skip (alpha=0.3) bảo tồn tín hiệu ngữ nghĩa khi đồ thị thưa/nhiễu.
model:
  semantic:
    backbone: "microsoft/codebert-base"
    output_dim: 256
    freeze_layers: 0           # Full fine-tuning cho mô hình 125M
    dropout: 0.1
    pooling: "cls"             # ★ [CLS] pooling cho encoder-only
    gradient_checkpointing: false
    use_fp16: true
  graph:
    node_feature_dim: 128
    hidden_dim: 256
    output_dim: 256
    num_layers: 4
    num_heads: 8
    num_edge_types: 3
    dropout: 0.2
  fusion:
    hidden_dim: 256
    num_heads: 8
    num_layers: 2
    dropout: 0.1
    combine: "gated"
    residual_alpha: 0.3        # ★ 30% semantic residual skip
  heads:
    binary: {hidden_dim: 128, dropout: 0.3}
