# configs/kaggle/model_kaggle.yaml
# Tối ưu cho Kaggle 2x T4 16GB (Internet ON).
# Binary classification: Qwen2.5-Coder-1.5B + LoRA + GraphCodeBERT + GAT.
#   - LoRA r=16/α=32 thay vì unfreeze top layers (tiết kiệm VRAM ~4GB).
#   - Gradient checkpointing cho Qwen (quan trọng).
#   - FP16 backbone + FP32 trainable parts (PyTorch AMP).
#   - Last-token pooling cho decoder-only LLM.
#   - Unfreeze top-6 GraphCodeBERT layers (chống collapse).
#   - Dynamic padding giảm VRAM theo max-len trong batch.
model:
  semantic:
    backbone: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
    output_dim: 256
    freeze_layers: 28          # Freeze toàn bộ nếu dùng LoRA
    dropout: 0.1
    pooling: "last"            # ★ Last-token pooling cho decoder-only
    gradient_checkpointing: true  # ★ Quan trọng: tiết kiệm VRAM ~3GB
    use_fp16: true
  graph:
    node_feature_dim: 128
    hidden_dim: 256
    output_dim: 256
    num_layers: 4
    num_heads: 8
    num_edge_types: 5
    dropout: 0.2
  fusion:
    hidden_dim: 256
    num_heads: 8
    num_layers: 2
    dropout: 0.1
    combine: "gated"
    residual_alpha: 0.3        # ★ 30% semantic residual skip
  heads:
    binary: {hidden_dim: 128, dropout: 0.3}

