# configs/kaggle/train_kaggle.yaml
# Tối ưu cho Kaggle 2x T4 16GB + Internet ON.
# Binary classification với tiered LR, threshold tuning, AMP FP16.
training:
  seed: 42
  device: "auto"           # train.py tự động DDP nếu có 2 GPU.
  num_workers: 2           # Tăng từ 0 → 2 để pipeline CPU-GPU overlap.
  pin_memory: true
  use_amp: true            # fp16 mixed precision
  optimizer: "adamw"
  learning_rate: 2.0e-5    # Backbone (LoRA)
  graph_learning_rate: 1.0e-4
  head_learning_rate: 2.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  scheduler: "cosine"
  epochs: 8                # ~2-3h trên 2xT4 với 1.5B + LoRA
  batch_size: 2            # per-device; eff = 2*4*2 = 16
  gradient_accumulation_steps: 4
  focal_alpha: 0.5
  focal_gamma: 2.0
  tune_threshold: true
  early_stopping:
    enabled: true
    patience: 2
    metric: "val_f1_binary"
    mode: "max"
  checkpoint:
    save_dir: "/kaggle/working/models/checkpoints"
    save_top_k: 1
    save_every_n_epochs: 0
  logging:
    backend: "tensorboard"
    log_dir: "/kaggle/working/runs/"
    log_every_n_steps: 20

