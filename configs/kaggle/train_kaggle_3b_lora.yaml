# configs/kaggle/train_kaggle_3b_lora.yaml
# Tối ưu cho Kaggle 2x T4 16GB + Qwen2.5-Coder-3B-Instruct LoRA (Internet ON, DataParallel + FP16)
# LoRA cần lr 10x full-finetune: 2e-4 vs 2e-5. Eff batch 1*16*2=32 (giữ như default 8*4).
# max_length 2048 giữ nguyên để lấy toàn bộ ngữ cảnh; LoRA r32 + fp16 + grad_ckpt bs1 vẫn FIT (~12GB/GPU trên T4 16GB).
training:
  seed: 42
  device: "auto"
  num_workers: 0           # 0 workers để tránh nhân bản RAM tiến trình trên Kaggle
  pin_memory: true
  use_amp: true

  optimizer: "adamw"
  learning_rate: 2.0e-4     # LoRA lr = 2e-4 (10x). Dùng 2e-5 sẽ không học
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.1

  scheduler: "cosine"
  epochs: 6
  batch_size: 1            # per-device 1 -> 2 GPUs = 2 active samples/step
  gradient_accumulation_steps: 16  # eff = 1*16*2 = 32

  early_stopping:
    enabled: true
    patience: 2
    metric: "val_f1_binary"
    mode: "max"

  checkpoint:
    save_dir: "/kaggle/working/models/checkpoints"
    save_top_k: 1
    save_every_n_epochs: 0

  loss_weights: {binary: 1.0, cwe: 0.5, severity: 0.2, localization: 0.4, source_sink: 0.15}
  quality_tiers: {gold: 1.0, silver: 0.85}

  logging:
    backend: "tensorboard"
    log_dir: "/kaggle/working/runs/"
    log_every_n_steps: 20
    wandb_project: "vulhunter-kaggle-3b-lora"
