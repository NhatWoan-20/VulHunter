# ─── Model Architecture — Source of truth cho VulHunterModel ───
# train.py loads file này qua --model-config và saves effective config vào checkpoint.
#
# Cập nhật theo phương pháp đã đề xuất:
#   - Semantic: LoRA r=16/α=32 + last-token pooling (decoder-only LLM)
#   - Graph: unfreeze top-6 GraphCodeBERT layers để phá AUC=0.5 collapse
#   - Fusion: residual_alpha=0.3 giữ semantic signal khi graph rỗng/noisy
#   - Heads: chỉ BinaryHead (multi-task sẽ thêm sau)
model:
  # ─── Semantic encoder (src/semantic/encoder.py) ───
  semantic:
    backbone: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
    output_dim: 256            # Projected fusion embedding dimension
    freeze_layers: 28          # Freeze bottom N layers (LoRA overrides this)
    dropout: 0.1
    pooling: "last"            # ★ last-token pooling (tốt nhất cho decoder-only)
    gradient_checkpointing: false  # Bật true nếu VRAM <14GB
    use_fp16: false            # Bật true nếu dùng FP16 cho backbone
    use_lora: true             # ★ LoRA: trainable <1% backbone, tiết kiệm ~4GB VRAM
    lora_r: 16                 # ★ Rank = 16 (gấp 4× notebook Qwen gốc)
    lora_alpha: 32             # = 2 * lora_r (chuẩn LoRA scaling)
    lora_dropout: 0.05
    use_rslora: true           # Rank-stabilized LoRA
    lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

  # ─── Graph encoder (src/graph/encoder.py) ───
  graph:
    use_graphcodebert: true
    node_feature_dim: 128
    hidden_dim: 256
    output_dim: 256            # Must equal semantic.output_dim for fusion
    num_layers: 4
    num_heads: 8               # GAT attention heads
    num_edge_types: 5
    dropout: 0.2
    unfreeze_top_n: 6          # ★ Unfreeze 6/12 GraphCodeBERT top layers (chống AUC=0.5 collapse)

  # ─── Cross-modal fusion (src/fusion/cross_attention.py) ───
  fusion:
    hidden_dim: 256
    num_heads: 8
    num_layers: 2
    dropout: 0.1
    combine: "gated"           # gated | concat | mean
    residual_alpha: 0.3        # ★ 30% semantic-only skip

  # ─── Prediction heads (chỉ binary) ───
  heads:
    binary:
      hidden_dim: 128
      dropout: 0.3
