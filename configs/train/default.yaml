# ─── Training Configuration (Master 1-Stage, Pillar 4 — synced with scripts/training/train.py) ───
training:
  seed: 42
  device: "auto"
  num_workers: 0
  pin_memory: true

  optimizer: "adamw"
  learning_rate: 1.5e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.1

  scheduler: "cosine"
  epochs: 20
  batch_size: 8
  gradient_accumulation_steps: 4

  early_stopping:
    enabled: true
    patience: 4
    metric: "val_f1_binary"
    mode: "max"

  checkpoint:
    save_dir: "models/checkpoints"
    save_top_k: 1
    save_every_n_epochs: 0

  # Multi-task loss weights — synced with src/utils/losses.py MultiTaskLoss defaults
  # (train.py honors these via criterion.update_weights()).
  loss_weights:
    binary: 1.0
    cwe: 0.5
    severity: 0.2
    localization: 0.4          # ACTIVE from v3.2: token→line max-pool via token_line_ids_qwen
    source_sink: 0.15          # ACTIVE from v3.2: weak heuristic supervision (lexicon)

  quality_tiers:
    gold: 1.0
    silver: 0.85

  logging:
    backend: "tensorboard"
    log_dir: "runs/"
    log_every_n_steps: 50
    wandb_project: "vulhunter"
