# ─── Training Configuration (Graph Only) ───
training:
  seed: 42
  device: "auto"
  num_workers: 0
  pin_memory: true

  optimizer: "adamw"
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.1

  scheduler: "cosine"
  epochs: 30
  batch_size: 16
  gradient_accumulation_steps: 2

  early_stopping:
    enabled: true
    patience: 5
    metric: "val_f1_binary"
    mode: "max"

  checkpoint:
    save_dir: "models/checkpoints"
    save_top_k: 1
    save_every_n_epochs: 0

  loss_weights:
    binary: 1.0
    cwe: 0.5
    severity: 0.2

  quality_tiers:
    gold: 1.0
    silver: 0.85

  logging:
    backend: "tensorboard"
    log_dir: "runs/"
    log_every_n_steps: 50
    wandb_project: "vulhunter"
