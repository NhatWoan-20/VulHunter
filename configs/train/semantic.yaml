# ─── Training Configuration (Semantic Only Mode) ───
# Baseline semantic-only: chỉ dùng Qwen2.5-Coder + LoRA, không có graph.
# Mục đích: chứng minh semantic-only có giới hạn (recall thấp trên subtle vulnerabilities),
# do đó fusion với graph giúp cải thiện.
training:
  seed: 42
  device: "auto"
  num_workers: 2
  pin_memory: true

  optimizer: "adamw"
  learning_rate: 2.0e-5         # LoRA backbone
  head_learning_rate: 1.0e-4    # Binary head
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.1

  scheduler: "cosine"
  epochs: 10
  batch_size: 4                 # Per-device (no graph → batch lớn hơn)
  gradient_accumulation_steps: 4

  focal_alpha: 0.5
  focal_gamma: 2.0

  tune_threshold: true

  early_stopping:
    enabled: true
    patience: 3
    metric: "val_f1_binary"
    mode: "max"

  checkpoint:
    save_dir: "models/checkpoints/semantic"
    save_top_k: 1
    save_every_n_epochs: 0

  quality_tiers:
    gold: 1.0
    silver: 0.85

  logging:
    backend: "tensorboard"
    log_dir: "runs/semantic"
    log_every_n_steps: 50

# ─── Model overrides cho semantic-only ───
model:
  semantic:
    use_lora: true
    pooling: "last"
    gradient_checkpointing: false
    use_fp16: false
