# ─── Training Configuration (Semantic Only Mode - CodeBERT Baseline) ───
# Baseline semantic-only sử dụng CodeBERT (microsoft/codebert-base).
# Mục đích: Nghiên cứu khả năng của encoder-only model đời đầu so với LLM hiện đại.
training:
  seed: 42
  device: "auto"
  num_workers: 2
  pin_memory: true
  optimizer: "adamw"
  learning_rate: 2.0e-5         # Full-finetune lr
  head_learning_rate: 1.0e-4    # Binary head
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  scheduler: "cosine"
  epochs: 15                    # Có thể hội tụ nhanh hơn/chậm hơn LLM
  batch_size: 8                 # CodeBERT nhỏ nên có thể đẩy batch lớn hơn
  gradient_accumulation_steps: 2
  focal_alpha: 0.5
  focal_gamma: 2.0
  tune_threshold: true
  early_stopping:
    enabled: true
    patience: 3
    metric: "val_f1_binary"
    mode: "max"
  checkpoint:
    save_dir: "models/checkpoints/semantic_codebert"
    save_top_k: 1
    save_every_n_epochs: 0
  logging:
    backend: "tensorboard"
    log_dir: "runs/semantic_codebert"
    log_every_n_steps: 50
# ─── Model overrides cho CodeBERT ───
model:
  semantic:
    encoder_type: "codebert"
    backbone: "microsoft/codebert-base"

